  <body>
    <!-- Contenedor centrado -->
    <div class="login-container">
      <form class="login-form">
        <div class="brand-header">
          <h2 class="form-title">¡INICIAR SESION!</h2>
          <p class="form-subtitle">Ingresa tus datos para iniciar sesion.</p>
        </div>

        <!-- Campos de Entrada -->
        <div class="input-group">
          <div class="input-wrapper">
            <input type="email" id="adminEmail" placeholder="Correo Electrónico" required />
          </div>
        </div>

        <div class="input-group">
          <div class="input-wrapper">
            <input type="password" id="adminPassword" placeholder="Contraseña" required />
          </div>
        </div>

        <!-- Opciones del Formulario -->
        <div class="form-options">
          <label class="remember-me">
            <input type="checkbox" />
            <span>Recordarme</span>
          </label>
          <a href="#" class="forgot-password">¿Olvidaste tu contraseña?</a>
        </div>

        <!-- Botón Principal Premium -->
        <button type="submit" class="btn-submit" id="btnAdminLogin">
          <span class="btn-submit-text">Iniciar Sesión</span>
          <span class="btn-submit-spinner" style="display:none;">
            <i class="bi bi-arrow-repeat"></i> Ingresando...
          </span>
        </button>
      </form>
    </div>

    <script type="module" src="../js/views/admin-login.js"></script>
  </body>
