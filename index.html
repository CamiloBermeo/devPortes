<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nav DEVPORTES - Paleta Corregida v2</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Estilos específicos con la paleta de verdes aplicada al 100% -->
    <style>
        /* Enlaces del menú */
        .nav-link-custom {
            color: #1c1c1c !important;
            transition: color 0.2s ease;
        }
        .nav-link-custom:hover {
            color: #40b622 !important; /* Verde vibrante al pasar el mouse */
        }
        .nav-link-custom.active-green {
            color: #216e2a !important; /* Verde medio para la página activa (Nosotros) */
        }

        /* Botón Iniciar Sesión (Corregido con Verde Oscuro #224330 en Hover) */
        .btn-brand-outline {
            color: #1c1c1c !important;
            border: 1px solid #1c1c1c !important;
            background-color: transparent !important;
            transition: all 0.2s ease;
        }
        .btn-brand-outline:hover {
            color: #ffffff !important;
            background-color: #224330 !important; /* Verde Oscuro Institucional */
            border-color: #224330 !important;
        }

        /* Botón Reservar Ahora (Sólido Verde #40b622) */
        .btn-brand-solid {
            color: #ffffff !important;
            background-color: #40b622 !important;
            transition: all 0.2s ease;
        }
        .btn-brand-solid:hover {
            background-color: #216e2a !important; /* Verde medio al pasar el mouse */
        }

        /* Fondo Negro Carbón de la paleta */
        .bg-brand-dark {
            background-color: #1c1c1c !important;
        }

        /* Enlaces del Footer */
        .footer-link {
            color: #a3a3a3 !important; /* Gris claro para lectura suave */
            text-decoration: none;
            transition: color 0.2s ease;
        }

        .footer-link:hover {
            color: #40b622 !important; /* Cambia al verde vibrante en hover */
        }
    </style>
</head>
<body>

<!-- Navbar con borde superior vibrante (#40b622) -->
<nav class="navbar navbar-expand-lg navbar-light bg-white py-3 border-top border-4" style="border-color: #40b622 !important;">
    <div class="container-fluid px-lg-5">

        <!-- LOGO: D + DEVPORTES -->
        <a class="navbar-brand d-flex align-items-center gap-2" href="#">
            <!-- Contenedor con el verde oscuro (#224330) -->
            <div class="text-white d-flex align-items-center justify-content-center rounded-3 fw-bold" style="width: 38px; height: 38px; font-size: 1.2rem; background-color: #224330;">
                D
            </div>
            <!-- Texto del logo -->
            <span class="fs-4 fw-black tracking-tight m-0 p-0" style="font-weight: 900; letter-spacing: -0.5px; color: #1c1c1c;">
                    DEV<span class="fw-bold" style="color: #216e2a;">PORTES</span>
                </span>
        </a>

        <!-- Botón Hamburguesa para Móviles -->
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <!-- MENÚ CENTRAL Y BOTONES -->
        <div class="collapse navbar-collapse" id="navbarNav">

            <!-- Links de navegación con hovers -->
            <ul class="navbar-nav mx-auto gap-3 text-center my-3 my-lg-0">
                <li class="nav-item">
                    <a class="nav-link fw-medium nav-link-custom" href="#">Nuestras Canchas</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link fw-bold nav-link-custom active-green" href="#">Nosotros</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link fw-medium nav-link-custom" href="#">¿Cómo funciona?</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link fw-medium nav-link-custom" href="#">Galería</a>
                </li>
            </ul>

            <!-- Botones del extremo derecho -->
            <div class="d-flex flex-column flex-lg-row align-items-center gap-3">
                <!-- Botón Iniciar Sesión (Hover verde oscuro corregido) -->
                <a href="#" class="btn btn-brand-outline px-4 py-2 rounded-3 fw-medium w-100 w-lg-auto text-nowrap">
                    Iniciar Sesión
                </a>

                <!-- Botón Reservar Ahora -->
                <a href="#" class="btn btn-brand-solid px-4 py-2 rounded-pill fw-bold d-flex align-items-center justify-content-center gap-2 w-100 w-lg-auto text-nowrap">
                    Reservar Ahora <span>&rarr;</span>
                </a>
            </div>

        </div>
    </div>
</nav>



<!-- FOOTER: Con el fondo #1c1c1c y un sutil borde superior con el verde institucional #224330 -->
<footer class="bg-brand-dark text-white py-4 border-top border-4" style="border-color: #224330 !important;">
    <div class="container-fluid px-lg-5">
        <div class="row align-items-center justify-content-between gy-3">

            <!-- COLUMNA IZQUIERDA: LOGO ADAPTADO A FONDO OSCURO -->
            <div class="col-12 col-md-auto d-flex align-items-center justify-content-center justify-content-md-start gap-2">
                <!-- Contenedor con el verde oscuro institucional (#224330) -->
                <div class="text-white d-flex align-items-center justify-content-center rounded-3 fw-bold" style="width: 38px; height: 38px; font-size: 1.2rem; background-color: #224330;">
                    D
                </div>
                <!-- Texto del logo invertido para fondo oscuro -->
                <span class="fs-4 fw-black tracking-tight m-0 p-0" style="font-weight: 900; letter-spacing: -0.5px; color: #ffffff;">
                        DEV<span class="fw-bold" style="color: #40b622;">PORTES</span>
                    </span>
            </div>

            <!-- COLUMNA DERECHA: ENLACES SECUNDARIOS Y LEGALES -->
            <div class="col-12 col-md-auto">
                <ul class="list-unstyled d-flex flex-wrap justify-content-center justify-content-md-end gap-4 m-0 p-0 fw-medium" style="font-size: 0.9rem;">
                    <li>
                        <a href="#" class="footer-link">Inicio</a>
                    </li>
                    <li>
                        <a href="#" class="footer-link">Términos y Condiciones</a>
                    </li>
                    <li>
                        <a href="#" class="footer-link">Política de Privacidad</a>
                    </li>
                    <li>
                        <a href="#" class="footer-link">Soporte</a>
                    </li>
                </ul>
            </div>

        </div>

        <!-- LÍNEA DE COPYRIGHT INFERIOR -->
        <div class="row mt-4 pt-3 border-top border-secondary border-opacity-10 text-center text-md-start">
            <div class="col-12">
                <p class="m-0 small text-secondary opacity-50">&copy; 2026 DEVPORTES. Todos los derechos reservados.</p>
            </div>
        </div>
    </div>
</footer>

<!-- Bootstrap 5 JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
